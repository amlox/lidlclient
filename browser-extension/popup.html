<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Lidl Reels Controls</title>
<style>body{font:14px system-ui;width:310px;padding:16px;background:#161b26;color:#eee}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0}p{line-height:1.5}button{cursor:pointer}</style>
<h2>Reels Controls</h2><p>Open Instagram Reels, then connect this tab to Minecraft.</p>
<label for="code">Connection code from /lidl</label><input id="code" type="password" autocomplete="off" placeholder="Paste connection code">
<button id="connect">Control this tab</button><button id="stop">Disconnect</button>
<p id="status" role="status">Disconnected</p><script src="popup.js"></script></html>
