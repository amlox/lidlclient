# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: test and start local party relay
        run: |
          python3 -m venv "$RUNNER_TEMP/party-sync-venv"
          "$RUNNER_TEMP/party-sync-venv/bin/pip" install -r tools/party-sync/requirements.txt
          "$RUNNER_TEMP/party-sync-venv/bin/python" -m unittest discover -s tools/party-sync -p 'test_*.py' -v
          "$RUNNER_TEMP/party-sync-venv/bin/python" tools/party-sync/server.py --data "$RUNNER_TEMP/party-rooms.json" > "$RUNNER_TEMP/party-sync.log" 2>&1 &
      - name: build
        env:
          PARTY_SYNC_TEST_URL: ws://127.0.0.1:8765
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
